<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/SapthagiriLogo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Sapthagiri PU College | Question Paper Generator</title>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #06101E; padding: 16px; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
        <div style="background: #ffffff; padding: 40px; border-radius: 28px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); max-width: 440px; width: 100%; text-align: center; border-bottom: 6px solid #f59e0b;">
          <div style="width: 88px; height: 88px; border-radius: 50%; overflow: hidden; margin: 0 auto 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.15); background: #ffffff; padding: 3px; border: 2px solid #f59e0b;">
            <img src="/SapthagiriLogo.jpg" alt="Sapthagiri PU College" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;" />
          </div>
          <h1 style="font-size: 22px; font-weight: 900; color: #081B3B; margin: 0 0 4px 0; letter-spacing: -0.01em; text-transform: uppercase;">Sapthagiri PU College</h1>
          <p style="font-size: 11px; font-weight: 800; color: #d97706; text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 4px 0;">Davanagere • The Land of Opportunity</p>
          <p style="font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 0.1em; margin: 0 0 24px 0;">Question Paper Generator Suite</p>
          <div style="display: flex; justify-content: center; align-items: center; gap: 10px; padding: 12px; color: #081B3B; font-size: 12px; font-weight: 700;">
            <div style="width: 18px; height: 18px; border: 3px solid #081B3B; border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <span>Starting Portal...</span>
          </div>
        </div>
      </div>
      <style>
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
