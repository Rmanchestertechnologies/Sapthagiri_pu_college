services:
  - type: web
    name: sapthagiri-pu-college-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── MongoDB Atlas — primary database for users/faculty ──────────────────
      - key: MONGO_URI
        sync: false   # set in the Render dashboard
      # ── Supabase PostgreSQL — subject question databases ────────────────────
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard
      - key: DIRECT_DATABASE_URL
        sync: false   # set in the Render dashboard
      - key: SUPABASE_URL
        value: https://vukxgqkrersxcasdklda.supabase.co
      - key: JWT_SECRET
        sync: false   # set in the Render dashboard
      - key: JWT_EXPIRES_IN
        value: 10h
      - key: ADMIN_PASSWORD
        sync: false   # set in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # set in the Render dashboard
      - key: DB_MATH_11_URL
        sync: false   # set in the Render dashboard
      - key: DB_MATH_12_URL
        sync: false   # set in the Render dashboard
      - key: DB_CHEM_11_URL
        sync: false   # set in the Render dashboard
      - key: DB_CHEM_12_URL
        sync: false   # set in the Render dashboard
      - key: DB_BIO_11_URL
        sync: false   # set in the Render dashboard
      - key: DB_BIO_12_URL
        sync: false   # set in the Render dashboard
      - key: DB_PHY_11_URL
        sync: false   # set in the Render dashboard
      - key: DB_PHY_12_URL
        sync: false   # set in the Render dashboard
      # ── Added with the security fixes; all are set in the Render dashboard ──────────────
      - key: LAB_ID
        sync: false
      - key: LAB_PASSWORD
        sync: false
      - key: LAB_IP
        sync: false
      - key: DB_QBP_CONTROL_KEY
        sync: false
      - key: DB_SSL_CA
        sync: false
