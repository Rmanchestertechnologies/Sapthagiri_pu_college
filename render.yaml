services:
  - type: web
    name: sapthagiri-pu-college-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    # Installs the server and, for the OMR scanner, its Python libraries into omr_engine/pylibs (the folder that survives
    # between build and run). If the pip step fails the API still starts; the OMR screen then explains what is missing.
    buildCommand: npm ci --omit=dev && (pip3 install --no-cache-dir --target omr_engine/pylibs -r omr_engine/requirements.txt || echo "WARNING - OMR libraries were not installed")
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # ── Supabase PostgreSQL — subject question databases ────────────────────
      - key: DATABASE_URL
        sync: false   # set in the Render dashboard
      - key: DIRECT_DATABASE_URL
        sync: false   # set in the Render dashboard
      - key: SUPABASE_URL
        value: https://vukxgqkrersxcasdklda.supabase.co
      - key: JWT_SECRET
        sync: false   # set in the Render dashboard
      - key: JWT_EXPIRES_IN
        value: 10h
      - key: ADMIN_PASSWORD
        sync: false   # set in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false   # set in the Render dashboard
      - key: DB_MATH_11_URL
        sync: false   # set in the Render dashboard
      - key: DB_MATH_12_URL
        sync: false   # set in the Render dashboard
      - key: DB_CHEM_11_URL
        sync: false   # set in the Render dashboard
      - key: DB_CHEM_12_URL
        sync: false   # set in the Render dashboard
      - key: DB_BIO_11_URL
        sync: false   # set in the Render dashboard
      - key: DB_BIO_12_URL
        sync: false   # set in the Render dashboard
      - key: DB_PHY_11_URL
        sync: false   # set in the Render dashboard
      - key: DB_PHY_12_URL
        sync: false   # set in the Render dashboard
      # ── Added with the security fixes; all are set in the Render dashboard ──────────────
      - key: LAB_ID
        sync: false
      - key: LAB_PASSWORD
        sync: false
      - key: LAB_IP
        sync: false
      - key: DB_QBP_CONTROL_KEY
        sync: false
      - key: DB_SSL_CA
        sync: false
      # ── Proxies, OMR and optional services ────────────────────────────────────────────
      # Browser -> Vercel (rewrite) -> Render is TWO proxies, so the client address is the second entry from the right.
      # Keep it at 2 only while students and staff use the Vercel address; if the API is also used directly at its onrender.com
      # address the lab-network check can be bypassed by a forged X-Forwarded-For (see docs/REVIEW_FINDINGS.md RV-07).
      - key: TRUST_PROXY_HOPS
        value: 2
      - key: PYTHON_BIN
        value: python3
      - key: DB_POOL_MAX
        value: 10
      - key: DB_QBP_CONTROL_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GEMINI_API_KEY      # optional: AI question variants and Grand Test text parsing
        sync: false
